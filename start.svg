<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1215" viewBox="0 0 720 1215" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker></defs>
<rect width="720" height="1215" rx="18" fill="#f6f8fa"/>
<rect x="20" y="20.0" width="390" height="114.2" rx="14" fill="#ffffff" stroke="#24292f" stroke-width="3"/>
<text x="215.0" y="57.8" text-anchor="middle" font-size="25" fill="#24292f" font-weight="bold">Switch 2 on firmware 23.0.1</text>
<text x="215.0" y="89.0" text-anchor="middle" font-size="25" fill="#24292f" font-weight="bold">or lower?</text>
<text x="215.0" y="114.5" text-anchor="middle" font-size="19" fill="#57606a">System Settings &gt; System</text>
<rect x="470" y="26.0" width="230" height="102.2" rx="14" fill="#ffebe9" stroke="#cf222e" stroke-width="3"/>
<text x="585.0" y="57.7" text-anchor="middle" font-size="21" fill="#24292f">Stop here. 23.5.0</text>
<text x="585.0" y="84.0" text-anchor="middle" font-size="21" fill="#24292f">reportedly patched</text>
<text x="585.0" y="110.2" text-anchor="middle" font-size="21" fill="#24292f">the exploit</text>
<line x1="410" y1="77.1" x2="466" y2="77.1" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>
<text x="440.0" y="67.1" text-anchor="middle" font-size="20" fill="#57606a" font-weight="bold">No</text>
<line x1="215.0" y1="134.2" x2="215.0" y2="180.2" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>
<text x="247.0" y="167.2" text-anchor="middle" font-size="20" fill="#57606a" font-weight="bold">Yes</text>
<rect x="20" y="184.2" width="390" height="106.8" rx="14" fill="#ffffff" stroke="#24292f" stroke-width="3"/>
<text x="215.0" y="233.9" text-anchor="middle" font-size="25" fill="#24292f" font-weight="bold">Seedsow Lullaby installed?</text>
<text x="215.0" y="259.4" text-anchor="middle" font-size="19" fill="#57606a">Demo or full game</text>
<rect x="470" y="190.2" width="230" height="94.8" rx="14" fill="#ffebe9" stroke="#cf222e" stroke-width="3"/>
<text x="585.0" y="218.2" text-anchor="middle" font-size="21" fill="#24292f">Get it first. The</text>
<text x="585.0" y="244.4" text-anchor="middle" font-size="21" fill="#24292f">demo is gone from</text>
<text x="585.0" y="270.7" text-anchor="middle" font-size="21" fill="#24292f">the eShop</text>
<line x1="410" y1="237.6" x2="466" y2="237.6" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>
<text x="440.0" y="227.6" text-anchor="middle" font-size="20" fill="#57606a" font-weight="bold">No</text>
<line x1="215.0" y1="291.0" x2="215.0" y2="337.0" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>
<text x="247.0" y="324.0" text-anchor="middle" font-size="20" fill="#57606a" font-weight="bold">Yes</text>
<rect x="20" y="341.0" width="390" height="133.0" rx="14" fill="#ffffff" stroke="#24292f" stroke-width="3"/>
<text x="215.0" y="391.9" text-anchor="middle" font-size="25" fill="#24292f" font-weight="bold">Exploit save in Seedsow?</text>
<text x="215.0" y="417.4" text-anchor="middle" font-size="19" fill="#57606a">alula's launcher save or the Lua</text>
<text x="215.0" y="441.2" text-anchor="middle" font-size="19" fill="#57606a">editor save</text>
<rect x="470" y="347.0" width="230" height="121.0" rx="14" fill="#dafbe1" stroke="#1a7f37" stroke-width="3"/>
<text x="585.0" y="374.9" text-anchor="middle" font-size="21" fill="#24292f">Step 1: get the</text>
<text x="585.0" y="401.2" text-anchor="middle" font-size="21" fill="#24292f">save, with a</text>
<text x="585.0" y="427.4" text-anchor="middle" font-size="21" fill="#24292f">Switch 1 or</text>
<text x="585.0" y="453.7" text-anchor="middle" font-size="21" fill="#24292f">SmileBASIC 4</text>
<line x1="410" y1="407.5" x2="466" y2="407.5" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>
<text x="440.0" y="397.5" text-anchor="middle" font-size="20" fill="#57606a" font-weight="bold">No</text>
<line x1="215.0" y1="474.0" x2="215.0" y2="520.0" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>
<text x="247.0" y="507.0" text-anchor="middle" font-size="20" fill="#57606a" font-weight="bold">Yes</text>
<rect x="20" y="524.0" width="390" height="138.0" rx="14" fill="#ffffff" stroke="#24292f" stroke-width="3"/>
<text x="215.0" y="561.8" text-anchor="middle" font-size="25" fill="#24292f" font-weight="bold">Does it open alula's</text>
<text x="215.0" y="593.0" text-anchor="middle" font-size="25" fill="#24292f" font-weight="bold">launcher?</text>
<text x="215.0" y="618.5" text-anchor="middle" font-size="19" fill="#57606a">A black A / B / Y menu, maybe from</text>
<text x="215.0" y="642.3" text-anchor="middle" font-size="19" fill="#57606a">an editor slot</text>
<rect x="470" y="530.0" width="230" height="126.0" rx="14" fill="#dafbe1" stroke="#1a7f37" stroke-width="3"/>
<text x="585.0" y="573.6" text-anchor="middle" font-size="21" fill="#24292f">Step 2: add the</text>
<text x="585.0" y="599.8" text-anchor="middle" font-size="21" fill="#24292f">launcher to the</text>
<text x="585.0" y="626.1" text-anchor="middle" font-size="21" fill="#24292f">Lua editor</text>
<line x1="410" y1="593.0" x2="466" y2="593.0" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>
<text x="440.0" y="583.0" text-anchor="middle" font-size="20" fill="#57606a" font-weight="bold">No</text>
<line x1="215.0" y1="662.0" x2="215.0" y2="708.0" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>
<text x="247.0" y="695.0" text-anchor="middle" font-size="20" fill="#57606a" font-weight="bold">Yes</text>
<rect x="20" y="712.0" width="390" height="138.0" rx="14" fill="#ffffff" stroke="#24292f" stroke-width="3"/>
<text x="215.0" y="749.8" text-anchor="middle" font-size="25" fill="#24292f" font-weight="bold">Semi-untethered chain</text>
<text x="215.0" y="781.0" text-anchor="middle" font-size="25" fill="#24292f" font-weight="bold">uploaded?</text>
<text x="215.0" y="806.5" text-anchor="middle" font-size="19" fill="#57606a">The one-time upload from a PC that</text>
<text x="215.0" y="830.3" text-anchor="middle" font-size="19" fill="#57606a">makes it console-only</text>
<rect x="470" y="718.0" width="230" height="126.0" rx="14" fill="#dafbe1" stroke="#1a7f37" stroke-width="3"/>
<text x="585.0" y="774.7" text-anchor="middle" font-size="21" fill="#24292f">Step 3: upload it</text>
<text x="585.0" y="801.0" text-anchor="middle" font-size="21" fill="#24292f">from a PC, once</text>
<line x1="410" y1="781.0" x2="466" y2="781.0" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>
<text x="440.0" y="771.0" text-anchor="middle" font-size="20" fill="#57606a" font-weight="bold">No</text>
<line x1="215.0" y1="850.0" x2="215.0" y2="896.0" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>
<text x="247.0" y="883.0" text-anchor="middle" font-size="20" fill="#57606a" font-weight="bold">Yes</text>
<rect x="20" y="900.0" width="390" height="138.0" rx="14" fill="#ffffff" stroke="#24292f" stroke-width="3"/>
<text x="215.0" y="937.8" text-anchor="middle" font-size="25" fill="#24292f" font-weight="bold">kaiHEN files on the SD</text>
<text x="215.0" y="969.0" text-anchor="middle" font-size="25" fill="#24292f" font-weight="bold">card?</text>
<text x="215.0" y="994.5" text-anchor="middle" font-size="19" fill="#57606a">/kaihen/bin/ with bootstrap.bin,</text>
<text x="215.0" y="1018.3" text-anchor="middle" font-size="19" fill="#57606a">ro, hen, game</text>
<rect x="470" y="906.0" width="230" height="126.0" rx="14" fill="#dafbe1" stroke="#1a7f37" stroke-width="3"/>
<text x="585.0" y="949.6" text-anchor="middle" font-size="21" fill="#24292f">Step 4: Prepare</text>
<text x="585.0" y="975.8" text-anchor="middle" font-size="21" fill="#24292f">SD, or unzip a</text>
<text x="585.0" y="1002.1" text-anchor="middle" font-size="21" fill="#24292f">kaiHEN release</text>
<line x1="410" y1="969.0" x2="466" y2="969.0" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>
<text x="440.0" y="959.0" text-anchor="middle" font-size="20" fill="#57606a" font-weight="bold">No</text>
<line x1="215.0" y1="1038.0" x2="215.0" y2="1084.0" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>
<text x="247.0" y="1071.0" text-anchor="middle" font-size="20" fill="#57606a" font-weight="bold">Yes</text>
<rect x="20" y="1088.0" width="390" height="106.8" rx="14" fill="#ddf4ff" stroke="#0969da" stroke-width="3"/>
<text x="215.0" y="1125.8" text-anchor="middle" font-size="25" fill="#24292f" font-weight="bold">Step 5, every boot</text>
<text x="215.0" y="1151.3" text-anchor="middle" font-size="19" fill="#24292f">Press A, wait for READY, close,</text>
<text x="215.0" y="1175.0" text-anchor="middle" font-size="19" fill="#24292f">hold R on a game</text>
<rect x="470" y="1088.0" width="230" height="106.8" rx="14" fill="#ddf4ff" stroke="#0969da" stroke-width="3"/>
<text x="585.0" y="1122.0" text-anchor="middle" font-size="21" fill="#24292f">No Switch 2 game?</text>
<text x="585.0" y="1148.2" text-anchor="middle" font-size="21" fill="#24292f">Step 6: hold R on</text>
<text x="585.0" y="1174.5" text-anchor="middle" font-size="21" fill="#24292f">a Switch 1 game</text>
</svg>
